<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" font-family="'Yu Gothic UI','Yu Gothic','Meiryo',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a44"/>
    </marker>
  </defs>
  <rect width="1200" height="860" fill="#fbfcfd"/>

  <text x="60" y="44" font-family="'Yu Mincho','Yu Gothic UI',serif" font-size="26" font-weight="700" fill="#1b2a44">ひとめぐり便　サービス構成図</text>

  <!-- ブラウザ -->
  <rect x="60" y="70" width="1080" height="170" rx="14" fill="#eef1f6" stroke="#1b2a44" stroke-width="2"/>
  <text x="84" y="100" font-size="18" font-weight="700" fill="#1b2a44">スマホのブラウザ</text>
  <text x="250" y="100" font-size="14" fill="#44546f">React 18 + TypeScript の SPA（自前ハッシュルーター）</text>

  <rect x="90" y="115" width="430" height="70" rx="8" fill="#ffffff" stroke="#1b2a44" stroke-width="1.5"/>
  <text x="305" y="143" font-size="16" font-weight="700" fill="#1b2a44" text-anchor="middle">旅行者の画面</text>
  <text x="305" y="168" font-size="13" fill="#44546f" text-anchor="middle">計画／マップ／思い出便／ひとめぐり帖／クーポン</text>

  <rect x="545" y="115" width="255" height="70" rx="8" fill="#ffffff" stroke="#1b2a44" stroke-width="1.5"/>
  <text x="672" y="143" font-size="16" font-weight="700" fill="#1b2a44" text-anchor="middle">運営の窓</text>
  <text x="672" y="168" font-size="13" fill="#44546f" text-anchor="middle">#/admin</text>

  <rect x="825" y="115" width="285" height="70" rx="8" fill="#ffffff" stroke="#1b2a44" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="967" y="143" font-size="16" font-weight="700" fill="#1b2a44" text-anchor="middle">デモ画面</text>
  <text x="967" y="168" font-size="13" fill="#44546f" text-anchor="middle">#/present</text>

  <text x="90" y="218" font-size="14" fill="#1b2a44">端末の機能：カメラ（getUserMedia）・傾きセンサー・Canvas 合成・印刷</text>

  <!-- HTTP -->
  <line x1="600" y1="244" x2="600" y2="306" stroke="#1b2a44" stroke-width="2.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="620" y="270" font-size="15" font-weight="700" fill="#1b2a44">HTTP（同一オリジン）</text>
  <text x="620" y="291" font-size="13" fill="#44546f">画面の取得 ／ /api/* の JSON ／ 写真アップロード</text>

  <!-- サーバ -->
  <rect x="60" y="310" width="1080" height="330" rx="14" fill="#1b2a44"/>
  <text x="84" y="340" font-size="18" font-weight="700" fill="#ffffff">PC 1 台</text>
  <text x="170" y="340" font-size="14" fill="#c9d2e3">uvicorn 1 プロセス（127.0.0.1:8000）で FastAPI を実行</text>

  <rect x="90" y="355" width="1020" height="42" rx="8" fill="#34466a"/>
  <text x="600" y="382" font-size="15" fill="#ffffff" text-anchor="middle">ミドルウェア：セキュリティヘッダ（CSP ほか）・エラー整形・request_id</text>

  <rect x="90" y="420" width="240" height="80" rx="8" fill="#ffffff"/>
  <text x="210" y="452" font-size="16" font-weight="700" fill="#1b2a44" text-anchor="middle">静的配信</text>
  <text x="210" y="477" font-size="13" fill="#44546f" text-anchor="middle">frontend/dist（ビルド済み画面）</text>

  <rect x="370" y="420" width="380" height="50" rx="8" fill="#ffffff"/>
  <text x="390" y="451" font-size="16" font-weight="700" fill="#1b2a44">api/</text>
  <text x="440" y="451" font-size="13" fill="#44546f">入力検証（pydantic）　/api/*</text>

  <rect x="370" y="490" width="380" height="50" rx="8" fill="#ffffff"/>
  <text x="390" y="521" font-size="16" font-weight="700" fill="#1b2a44">services/</text>
  <text x="478" y="521" font-size="13" fill="#44546f">業務ルール（季節・抽選・おもいで便ほか）</text>

  <rect x="370" y="560" width="380" height="50" rx="8" fill="#ffffff"/>
  <text x="390" y="591" font-size="16" font-weight="700" fill="#1b2a44">repositories/</text>
  <text x="510" y="591" font-size="13" fill="#44546f">SQL（プレースホルダのみ）</text>

  <rect x="800" y="420" width="310" height="50" rx="8" fill="#ffffff" stroke="#c9d2e3" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="820" y="451" font-size="16" font-weight="700" fill="#1b2a44">/api/demo/*</text>
  <text x="930" y="451" font-size="13" fill="#44546f">デモ時計の場面切替</text>

  <rect x="800" y="490" width="310" height="50" rx="8" fill="#ffffff"/>
  <text x="820" y="521" font-size="16" font-weight="700" fill="#1b2a44">clock</text>
  <text x="880" y="521" font-size="13" fill="#44546f">時刻の取得はここ 1 箇所</text>

  <g stroke="#ffffff" stroke-width="2" fill="none">
    <line x1="560" y1="470" x2="560" y2="488"/>
    <line x1="560" y1="540" x2="560" y2="558"/>
    <line x1="750" y1="505" x2="798" y2="505"/>
    <line x1="955" y1="470" x2="955" y2="488"/>
  </g>
  <g fill="#ffffff">
    <path d="M554,481 L566,481 L560,490 z"/>
    <path d="M554,551 L566,551 L560,560 z"/>
    <path d="M791,499 L791,511 L800,505 z"/>
    <path d="M949,481 L961,481 L955,490 z"/>
  </g>

  <!-- 保存先への線 -->
  <line x1="560" y1="610" x2="560" y2="696" stroke="#8fa0c0" stroke-width="2.5"/>
  <line x1="560" y1="640" x2="560" y2="696" stroke="#1b2a44" stroke-width="2.5" marker-end="url(#arr)"/>
  <polyline points="750,528 775,528 775,640" fill="none" stroke="#8fa0c0" stroke-width="2.5"/>
  <polyline points="775,640 775,745 796,745" fill="none" stroke="#1b2a44" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="210" y1="700" x2="210" y2="640" stroke="#1b2a44" stroke-width="2.5"/>
  <polyline points="210,640 210,528 366,528" fill="none" stroke="#8fa0c0" stroke-width="2.5"/>
  <path d="M359,522 L359,534 L370,528 z" fill="#ffffff"/>
  <text x="224" y="676" font-size="13" fill="#44546f">行検証して取り込み</text>
  <text x="574" y="676" font-size="13" fill="#44546f">読み書き</text>
  <text x="789" y="676" font-size="13" fill="#44546f">画像の保存・削除</text>

  <!-- 保存 -->
  <rect x="90" y="700" width="240" height="90" rx="8" fill="#ffffff" stroke="#1b2a44" stroke-width="1.5"/>
  <text x="210" y="737" font-size="16" font-weight="700" fill="#1b2a44" text-anchor="middle">sample-data の CSV 5 本</text>
  <text x="210" y="762" font-size="13" fill="#44546f" text-anchor="middle">入力データ（UTF-8 BOM）</text>

  <rect x="400" y="700" width="320" height="90" rx="8" fill="#eef1f6" stroke="#1b2a44" stroke-width="2"/>
  <text x="560" y="737" font-size="16" font-weight="700" fill="#1b2a44" text-anchor="middle">SQLite　data/app.db</text>
  <text x="560" y="762" font-size="13" fill="#44546f" text-anchor="middle">WAL・31 テーブル</text>

  <rect x="800" y="700" width="310" height="90" rx="8" fill="#eef1f6" stroke="#1b2a44" stroke-width="2"/>
  <text x="955" y="730" font-size="16" font-weight="700" fill="#1b2a44" text-anchor="middle">ローカルディスク</text>
  <text x="955" y="753" font-size="13" fill="#44546f" text-anchor="middle">data/uploads/　レシート画像（7 日で削除）</text>
  <text x="955" y="774" font-size="13" fill="#44546f" text-anchor="middle">data/photos/　AR フォト PNG</text>

  <!-- 注記 -->
  <rect x="60" y="812" width="520" height="34" rx="17" fill="#fff7e3" stroke="#e3a21a" stroke-width="2"/>
  <text x="320" y="834" font-size="14" font-weight="700" fill="#1b2a44" text-anchor="middle">外部サービスなし（外部 API・CDN・外部フォント・クラウド不使用）</text>
  <rect x="800" y="819" width="44" height="20" rx="4" fill="none" stroke="#1b2a44" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="854" y="834" font-size="13" fill="#44546f">点線 ＝ DEMO_MODE=1 のときだけ有効</text>
</svg>
