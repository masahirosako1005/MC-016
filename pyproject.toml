[project]
name = "hitomeguri-bin"
version = "0.1.0"
description = "ひとめぐり便 — 星凪諸島の再訪をつくる観光者アプリ"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn==0.34.0",
  "python-multipart==0.0.20",
  "pydantic==2.10.4",
]

[dependency-groups]
dev = [
  "pytest==8.3.4",
  "httpx==0.28.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
